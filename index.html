<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>青年共同体文档内容</title>
  <style>
    :root {
      --bg: #f3eee6;
      --panel: #f8f4ee;
      --line: #d8c8b7;
      --ink: #2a241f;
      --muted: #6b6258;
      --accent: #9d6032;
      --accent-deep: #834f29;
      --shadow: 0 20px 48px rgba(85, 60, 34, 0.08);
      --radius-xl: 34px;
      --radius-lg: 999px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(157, 96, 50, 0.1), transparent 24%),
        linear-gradient(180deg, #f6f2ea 0%, var(--bg) 100%);
    }

    .panel {
      width: min(980px, 100%);
      padding: 56px 34px 62px;
      border: 2px solid var(--line);
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, #fbf8f3 0%, #f7f2eb 100%);
      box-shadow: var(--shadow);
    }

    .label {
      display: inline-block;
      margin-bottom: 26px;
      padding: 10px 16px;
      border-radius: 6px;
      background: rgba(64, 64, 64, 0.78);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      align-items: stretch;
    }

    .actions a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 98px;
      padding: 20px 24px;
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: clamp(19px, 1.9vw, 24px);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.35;
      box-shadow: 0 14px 30px rgba(131, 79, 41, 0.2);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .actions a:hover {
      transform: translateY(-2px);
      filter: brightness(1.02);
      box-shadow: 0 18px 34px rgba(131, 79, 41, 0.24);
    }

    .actions a:active {
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 16px;
      }

      .panel {
        padding: 28px 18px 32px;
      }

      .label {
        font-size: 15px;
        margin-bottom: 20px;
      }

      .actions a {
        min-height: 74px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="label">青年共同体文档内容</div>
    <div class="actions">
      <a href="history.html">历史背景与系统梳理</a>
      <a href="index1.html">理念与半年实践计划</a>
      <a href="semester_youth_community_activity_system.html">一个学期的活动系统设计</a>
    </div>
  </main>
</body>
</html>
